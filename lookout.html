<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#06101d" />
  <title>The Lookout — The Unsent Museum</title>
  <script>
    /* Old links and bookmarks pointed to a separate lookout.html document,
       which tore down the background audio. Send them to the main SPA.
       All internal museum links now use #/lookout/... directly. */
    (() => {
      const hash = location.hash;
      const route = hash.startsWith('#/lookout') || hash.startsWith('#/sky/')
        ? hash : '#/lookout';
      const target = new URL('./', location.href);
      target.hash = route;
      location.replace(target.href);
    })();
  </script>
</head>
<body style="background:#06101d;color:#eadab2;font:16px system-ui,sans-serif;padding:3rem">
  <p>Opening The Lookout in The Unsent Museum…</p>
  <p><a style="color:#eadab2" href="./#/lookout">Open the Lookout</a></p>
</body>
</html>
