name: Museum mobile browser smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-browser-smoke.yml'
      - '.github/tests/mobile-browser-smoke.cjs'
      - 'app.js'
      - 'index.html'
      - 'compatibility-check.html'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/museum-browser-qa
          npm install --no-save --prefix /tmp/museum-browser-qa playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then
            /tmp/museum-browser-qa/node_modules/.bin/playwright install chromium
          fi
      - name: Test Android-sized, tablet and desktop journeys without writing production data
        shell: bash
        env:
          NODE_PATH: /tmp/museum-browser-qa/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/museum-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node .github/tests/mobile-browser-smoke.cjs
