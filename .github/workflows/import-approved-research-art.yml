name: Inspect generated art export URLs
on:
  push:
    paths:
      - '.github/workflows/import-approved-research-art.yml'
jobs:
  inspect-canva-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether full-resolution generated art can be viewed
        run: |
          python - <<'PY'
          import urllib.request
          for name,url in [('background','https://www.canva.com/d/Bh6ZpbjMz50_Btv'),('approved-mockup','https://www.canva.com/d/r6MPAlwP064SArW')]:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      body=resp.read()
                      print(name,'HTTP',resp.status,'bytes',len(body),'final',resp.url)
                      print(body[:200])
              except Exception as exc: print(name,'FAILED',repr(exc))
          PY
