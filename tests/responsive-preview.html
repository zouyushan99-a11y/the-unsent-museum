<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Museum responsive review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e9ed;color:#182334;font:15px system-ui,sans-serif}header{padding:16px 22px;background:#fff;border-bottom:1px solid #b9c2cf;display:flex;flex-wrap:wrap;gap:14px;align-items:center}h1{font-size:17px;margin:0 18px 0 0}label{display:flex;gap:7px;align-items:center}select{font:inherit;padding:9px;border:1px solid #9aa7b6;border-radius:6px}main{padding:24px;overflow:auto}iframe{display:block;border:0;background:#06101d;box-shadow:0 8px 28px #0003;max-width:none;margin:0 auto}p{margin:0;font-size:13px;color:#596778}output{font-variant-numeric:tabular-nums}
</style></head><body>
<header><h1>Museum responsive review</h1><label>Viewport <select id="device"><option value="390,844">Phone · 390 × 844</option><option value="320,720">Small phone · 320 × 720</option><option value="430,932">Large phone · 430 × 932</option><option value="768,1024">iPad portrait · 768 × 1024</option><option value="820,1180">iPad Air portrait · 820 × 1180</option><option value="1024,768">iPad landscape · 1024 × 768</option><option value="1180,820">iPad Air landscape · 1180 × 820</option><option value="1366,1024">Desktop · 1366 × 1024</option></select></label>
<label>Page <select id="page"><option value="/">Home</option><option value="/galleries">Galleries</option><option value="/history">Personal directory</option><option value="/history/franz-kafka">Kafka</option><option value="/collectives">Collective directory</option><option value="/collectives/victorian-domestic-servants">Collective dossier</option><option value="/research/friendship">Research</option><option value="/lookout">Lookout</option><option value="/story-sky">Story sky</option><option value="/archive">Story archive</option><option value="/account">Account</option><option value="/feedback">Feedback</option><option value="/experience/classroom">Interactive choice</option><option value="/about">About</option><option value="/privacy">Privacy</option></select></label><output id="size"></output><p>Development review only. Choose the language inside the museum. These are CSS viewports, not emulated touch hardware.</p></header>
<main><iframe id="museum" title="Museum device preview" width="390" height="844" src="../index.html#/"></iframe></main>
<script>
const frame=document.getElementById('museum'),device=document.getElementById('device'),page=document.getElementById('page');
function resize(){const [w,h]=device.value.split(',').map(Number);frame.width=w;frame.height=h;document.getElementById('size').textContent=w+' × '+h+' CSS px'}
device.addEventListener('change',resize);page.addEventListener('change',()=>{frame.src='../index.html#'+page.value});resize();
</script></body></html>
