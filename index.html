<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Unsent Museum</title>
<meta name="description" content="An interactive archive of silence and choices">
<style>
:root{--ink:#182232;--blue:#557ccc;--gold:#f4c850;--cream:#f8f5ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}a{color:inherit}nav{position:sticky;top:0;background:#101826;color:white;z-index:4;padding:13px 5%;display:flex;gap:22px;flex-wrap:wrap;align-items:center;font:14px system-ui}nav a{text-decoration:none}nav a:hover{text-decoration:underline}nav strong{margin-right:auto;letter-spacing:.06em}.wrap{width:min(950px,90%);margin:auto}.hero{background:radial-gradient(ellipse at 75% 25%,#273957,#070c17 60%);color:#faf5eb;padding:92px 0 100px}.eyebrow{font:12px system-ui;letter-spacing:.15em;text-transform:uppercase;color:#a6b7cf}h1{font-size:clamp(44px,7vw,92px);line-height:1.1;margin:22px 0}h2{font-size:clamp(28px,4vw,46px);line-height:1.2}h3{font-size:23px;line-height:1.3}.subtitle{max-width:680px;font-size:21px}.btn{cursor:pointer;display:inline-block;margin:8px 8px 8px 0;padding:12px 20px;background:#e7c771;color:#182232;border:1px solid #e7c771;border-radius:4px;font:600 14px system-ui;text-decoration:none}.btn.ghost{background:transparent;color:inherit;border-color:#8b94a6}.btn:disabled{opacity:.4;cursor:not-allowed}.page{padding:65px 0 90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}.tile{background:#fff;border:1px solid #ddd9d0;padding:24px;border-radius:8px;min-height:170px}.tile a{text-decoration:none}.tile:hover{border-color:#91a5c3}.muted{color:#627083;font:14px/1.6 system-ui}.story{font-size:21px;max-width:750px;line-height:1.85;white-space:pre-line}.panel{background:white;padding:30px;border:1px solid #ddd9d0;border-radius:8px;margin:25px 0}label.opt{display:block;padding:13px 15px;background:#f5f6f8;margin:10px 0;border-radius:5px;font:15px/1.4 system-ui;cursor:pointer}input[type=radio],input[type=checkbox]{accent-color:#506fae;margin-right:10px}textarea{width:100%;padding:13px;border:1px solid #c2cad3;border-radius:5px;font:15px/1.5 system-ui;resize:vertical}small{font:12px system-ui}footer{background:#111927;color:#c5cedd;padding:30px 5%;font:13px system-ui}.night{background:#020306;color:#eff1fa;padding:35px 25px;border-radius:8px;margin:20px 0}.sky{position:relative;height:310px;background:radial-gradient(ellipse at center,#0b1427,#000 73%);overflow:hidden;border-radius:6px}.star{position:absolute;width:6px;height:6px;border-radius:100%;box-shadow:0 0 12px currentColor;opacity:.9}.star.blue{color:#648ce1;background:#648ce1}.star.gold{color:#f4ca50;background:#f4ca50}.stat{display:flex;flex-wrap:wrap;gap:18px;font:14px system-ui}.stat span{display:inline-flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.bars{margin-top:20px}.bar{background:#17243b;height:10px;border-radius:8px;overflow:hidden;margin:7px 0 14px}.bar>i{display:block;background:#668bd7;height:100%}.notice{padding:16px;border-left:4px solid #e0b952;background:#f1ebdd;font:14px/1.6 system-ui;margin:20px 0}.chips{display:flex;flex-wrap:wrap;gap:9px}.chips a{border:1px solid #b6c2ce;text-decoration:none;padding:8px 12px;border-radius:30px;font:13px system-ui}.hidden{display:none}@media(max-width:550px){nav{gap:11px}nav strong{width:100%}.hero{padding:60px 0}.panel{padding:20px}.sky{height:250px}}
</style></head><body><nav><strong>The Unsent Museum</strong><a href="#/">Home</a><a href="#/galleries">Galleries</a><a href="#/archive">All Stories</a><a href="#/lookout">The Lookout</a><a href="#/about">About</a></nav><div id="app"></div><footer>The Unsent Museum · ENGL 4106 · A literary journalism prototype. <span id="mode">Preview mode</span></footer>
<script>
const scenes=[
{id:'friendship',name:'Between Friends',short:'Friendship',prompt:'During a discussion with friends, everyone seems to agree on a plan. You notice a problem, but raising it may disrupt the harmony. Would you remain silent?',story:'A conversation is moving towards agreement. Everyone appears relieved that a decision has been made. Then you notice something that might go wrong. You consider speaking, and you begin to weigh the cost of your words against the cost of keeping them to yourself.',silent:['I do not want to ruin the harmonious atmosphere.','I worry my friends will think badly of me and our friendship may suffer.','I could solve this privately later.','I am not certain my concern is correct.','Speaking up probably will not change the decision.','I do not want to embarrass anyone.','I would rather wait for a better moment.'],speak:['The problem needs attention now.','Real friendship should allow disagreement.','My opinion might help everyone.','I believe my friends will understand my intentions.','I would regret not saying anything.','I think everyone has a right to speak.','A public discussion would be more effective.']},
{id:'classroom',name:'In the Classroom',short:'Classroom',prompt:'You disagree with a point in class, but the teacher and most students seem convinced. Would you remain silent?',story:'The classroom feels settled on an answer. You have a different interpretation. The question is not whether you can raise your hand, but what it might cost to do so.',silent:['I do not want to disrupt the class.','I worry the teacher may judge me.','I am not sure whether I am correct.','I could ask privately after class.','I worry other students may dislike my opinion.','I think speaking up would change nothing.'],speak:['I think the point needs to be challenged.','I want to understand the topic better.','Other students may share my question.','I feel safe expressing disagreement.','I would regret not asking.','Discussion matters more than agreement.']},
{id:'family',name:'At Home',short:'Family',prompt:'A family member offers strong advice about your future. You disagree, but an argument seems likely. Would you remain silent?',story:'Advice is offered with care, but it does not fit the decision you want to make. You can hear affection and expectation in the same sentence. Your response remains unspoken.',silent:['I want to avoid an argument.','I do not want to hurt someone who cares about me.','I am afraid my opinion will not be respected.','I would rather demonstrate my choice through action.','This is not the right time.','I worry about the consequences of disagreeing.'],speak:['This decision affects my life.','My family should understand my view.','Honest disagreement can coexist with respect.','I want to prevent future misunderstandings.','I need to establish a boundary.','I feel prepared to explain my reasons.']},
{id:'before-sending',name:'Before Sending',short:'Before Sending',prompt:'You finish typing a message about something that bothers you. Your finger rests over Send. Would you decide not to send it?',story:'The message is complete. You reread it once, then again. The words seem different on the screen than they did in your head. The draft remains unsent.',silent:['I do not want to be misunderstood.','I may regret leaving a permanent record.','I could talk face to face instead.','I need more time to consider my words.','I do not want to upset the recipient.','The message no longer seems necessary.'],speak:['I think the recipient should know.','Writing helps me explain myself clearly.','The conversation cannot wait.','I want to address the misunderstanding.','I feel ready to take responsibility for the message.','Not sending would leave me with regret.']}
];
const KEY='unsent_preview_2026';const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{responses:[],stories:[]}}catch{return {responses:[],stories:[]}}};let db=load();const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=s=>document.querySelector(s);const link=(href,text,cl='btn')=>'<a class="'+cl+'" href="'+href+'">'+text+'</a>';const section=(body,head='')=>'<main class="wrap page">'+head+body+'</main>';const title=(s,sub='')=>'<div class="eyebrow">THE UNSENT MUSEUM</div><h1 style="font-size:clamp(40px,6vw,62px)">'+s+'</h1><p class="subtitle">'+sub+'</p>';const cat=id=>scenes.find(s=>s.id===id);
const exampleNotice='<p class="notice">The situations below are illustrative placeholders—not documented personal experiences. Before the final project they must be replaced with original, accurately labeled nonfiction accounts. This public preview stores answers only in your own browser; it does not collect real shared submissions.</p>';
function home(){return '<section class="hero"><div class="wrap"><div class="eyebrow">AN INTERACTIVE LITERARY MUSEUM</div><h1>The Unsent<br><em>Museum.</em></h1><p class="subtitle">Some words are never spoken. That does not mean they never existed.</p><p>Explore a moment of silence, make a choice, and watch it become a star.</p>'+link('#/galleries','Enter the Museum')+link('#/lookout','Visit the Lookout','btn ghost')+link('#/archive','Read All Stories','btn ghost')+'</div></section>'+section('<h2>Rooms of silence</h2><div class="grid">'+scenes.map(s=>'<div class="tile"><small>GALLERY</small><h3>'+s.name+'</h3><p class="muted">'+esc(s.prompt)+'</p>'+link('#/gallery/'+s.id,'Enter gallery')+'</div>').join('')+'<div class="tile"><h3>Others</h3><p class="muted">Stories beyond the four scenes.</p>'+link('#/archive/others','Explore other stories')+'</div></div>'+exampleNotice)}
function galleries(){return section('<div class="grid">'+scenes.map(s=>'<div class="tile"><h3>'+s.name+'</h3><p class="muted">'+s.prompt+'</p>'+link('#/gallery/'+s.id,'Enter')+'</div>').join('')+'<div class="tile"><h3>Others</h3>'+link('#/archive/others','Browse others')+'</div></div>',title('The Galleries','Each room gives you the choice to experience a scene or read the voices of others.'))}
function gallery(id){if(id==='others')return archive('others');const s=cat(id);if(!s)return home();return section('<div class="grid"><div class="tile"><h3>Experience the Moment</h3><p>Read an illustrative scene, decide whether to stay silent and select your reasons.</p>'+link('#/experience/'+id,'Begin experience')+'</div><div class="tile"><h3>Read Other Voices</h3><p>Discover anonymous stories in this gallery when they become available.</p>'+link('#/archive/'+id,'Visit story shelf')+'</div><div class="tile"><h3>The Lookout</h3><p>See the blue and golden stars for this situation.</p>'+link('#/lookout/'+id,'View this sky')+'</div></div>',title(s.name,s.prompt))}
let flow={};function experience(id,step=0){const s=cat(id);if(!s)return home();if(flow.id!==id)flow={id,choice:'',reasons:[],other:'',share:'no',story:'',why:''};let b=exampleNotice;if(step===0)b+='<div class="panel"><h3>A Moment of Silence</h3><p class="story">'+esc(s.story)+'</p><h3>'+esc(s.prompt)+'</h3><label class="opt"><input name="decision" type="radio" value="silent">Yes, I would remain silent.</label><label class="opt"><input name="decision" type="radio" value="speak">No, I would speak up.</label><button class="btn" id="next" disabled>Continue →</button></div>';if(step===1){let opts=flow.choice==='silent'?s.silent:s.speak;b+='<div class="panel"><h2>Why would you '+(flow.choice==='silent'?'remain silent':'speak up')+'?</h2><p class="muted">Select all that apply.</p>'+opts.map((x,i)=>'<label class="opt"><input type="checkbox" value="'+i+'"> '+esc(x)+'</label>').join('')+'<label class="opt"><input type="checkbox" value="other">Other reason</label><textarea id="other" rows="3" placeholder="Your other reason (optional)"></textarea><p><button class="btn" id="next" disabled>Continue →</button></p></div>'}if(step===2)b+='<div class="panel"><h2>Have you experienced something similar?</h2><p>Would you like to share your story? This preview saves your writing locally; it does not publish it online.</p><label class="opt"><input name="share" type="radio" value="no" checked> No, go to the Lookout.</label><label class="opt"><input name="share" type="radio" value="yes"> Yes, write a local story.</label><div id="storyfields" class="hidden"><p>Your Story</p><textarea id="story" rows="5" maxlength="4000" placeholder="What happened?"></textarea><p>Your Reason</p><textarea id="why" rows="3" maxlength="2000" placeholder="Why did you choose silence or speech?"></textarea></div><p><button class="btn" id="finish">Finish and visit Lookout →</button></p></div>';setTimeout(()=>bind(id,step),0);return section(b,title(s.name,'An interactive moment · '+(step+1)+' of 3'))}
function bind(id,step){if(!location.hash.startsWith('#/experience/'+id))return;if(step===0){document.querySelectorAll('[name=decision]').forEach(x=>x.onchange=()=>{flow.choice=x.value;$('#next').disabled=false});$('#next').onclick=()=>{location.hash='#/experience/'+id+'/1'}}if(step===1){const checks=()=>{flow.reasons=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);$('#next').disabled=flow.reasons.length===0};document.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=checks);$('#next').onclick=()=>{flow.other=$('#other').value.trim();if(flow.reasons.includes('other')&&!flow.other)return alert('Please explain your other reason.');location.hash='#/experience/'+id+'/2'}}if(step===2){document.querySelectorAll('[name=share]').forEach(x=>x.onchange=()=>{$('#storyfields').classList.toggle('hidden',x.value!=='yes');flow.share=x.value});$('#finish').onclick=()=>{if(db.responses.some(x=>x.id===id)){alert('You already answered this scene in this browser. Your earlier response will remain.')}else{db.responses.push({id,choice:flow.choice,reasons:flow.reasons,other:flow.other});}if(flow.share==='yes'){const story=$('#story').value.trim(),why=$('#why').value.trim();if(!story||!why)return alert('Both story and reason are required.');db.stories.push({id,story,why})}save();location.hash='#/lookout/'+id}}}
function archive(id='all'){const items=db.stories.filter(s=>id==='all'||s.id===id);return section('<div class="chips">'+[['all','All Stories'],...scenes.map(s=>[s.id,s.short]),['others','Others']].map(([key,name])=>'<a href="#/archive/'+key+'">'+name+'</a>').join('')+'</div>'+(!items.length?'<p class="notice">No stories in this collection yet. In this preview, only stories saved on this device appear here. Visitor submissions across devices require the secure backend to be enabled.</p>':items.map((s,i)=>'<article class="panel"><small>STORY '+(i+1)+' · '+esc(s.id)+'</small><h3>Anonymous Story</h3><p class="story">'+esc(s.story)+'</p><h4>Why I made that choice</h4><p>'+esc(s.why)+'</p></article>').join('')),title('The Complete Archive','An exhibition space for stories and their reasons.'))}
function sky(data){let st='<div class="sky">';const max=Math.min(data.length,320);for(let i=0;i<max;i++){const seed=i*137+31;const x=((seed*71)%947)/9.47,y=((seed*43)%991)/9.91;st+='<i class="star '+(data[i].choice==='silent'?'blue':'gold')+'" style="left:'+x+'%;top:'+y+'%;"></i>'}return st+'</div>'}
function lookout(id='all'){const a=db.responses.filter(r=>id==='all'||r.id===id),silent=a.filter(r=>r.choice==='silent').length,speak=a.length-silent;let out='<div class="night"><div class="eyebrow">A SKY MADE OF CHOICES</div>'+sky(a)+'<div class="stat"><span><i class="dot" style="background:#648ce1"></i> Silent: '+silent+'</span><span><i class="dot" style="background:#f4ca50"></i> Speak: '+speak+'</span><span>Total responses on this device: '+a.length+'</span></div></div>';if(a.length)out+='<p><strong>'+Math.round(silent/a.length*100)+'%</strong> chose silence · <strong>'+Math.round(speak/a.length*100)+'%</strong> chose to speak.</p>';let counts={};a.forEach(r=>r.reasons.forEach(k=>{let key=(cat(r.id)?.[r.choice]?.[Number(k)]||'Other reason');counts[key]=(counts[key]||0)+1}));out+='<h3>Reasons chosen</h3><div class="bars">'+Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<div>'+esc(k)+' · '+n+'<div class="bar"><i style="width:'+n/Math.max(1,a.length)*100+'%"></i></div></div>').join('')+'</div><p class="notice">Preview data is local to this browser, not a representative survey. Stars represent scenario answers rather than verified unique people.</p>';out+='<h3>Explore another constellation</h3><div class="chips">'+[['all','All skies'],...scenes.map(s=>[s.id,s.short])].map(([k,n])=>'<a href="#/lookout/'+k+'">'+n+'</a>').join('')+'</div>';return section(out,title('The Lookout',id==='all'?'Every choice leaves a light behind.':'Constellation: '+cat(id)?.name))}
function about(){return section('<div class="panel"><h2>About the project</h2><p>The Unsent Museum explores why people sometimes remain silent and why others choose to speak. Its intended foundation is first-person nonfiction, voluntary audience reflection, and research on communication.</p><p><strong>Current state:</strong> a public interface prototype. The four scenes are illustrative and not presented as verified autobiographical events. Responses and stories are stored only in this browser. A moderated Supabase-powered edition requires database security review before live collection.</p><p>Planned research: social expectations, communication privacy management, psychological safety, and literary journalism. The final project also needs a reflective statement and bibliography.</p><p><strong>Privacy:</strong> No live submission is sent to a server in this build. Do not enter secrets or identifying information. Data saved in this browser may be accessible to others using the same device.</p><button class="btn ghost" id="clear" style="color:#182232">Clear my local entries</button></div>',title('A Note from the Curator','Why do we choose silence?'))}
function render(hash=location.hash){let p=hash.replace(/^#\/?/,'').split('/').filter(Boolean);let page=p[0]||'home';$('#app').innerHTML=page==='home'?home():page==='galleries'?galleries():page==='gallery'?gallery(p[1]):page==='experience'?experience(p[1],Number(p[2]||0)):page==='archive'?archive(p[1]||'all'):page==='lookout'?lookout(p[1]||'all'):page==='about'?about():home();if($('#clear'))$('#clear').onclick=()=>{if(confirm('Delete local entries from this browser?')){db={responses:[],stories:[]};save();render('#/about')}};window.scrollTo(0,0)}window.addEventListener('hashchange',()=>render());render();
</script></body></html>
