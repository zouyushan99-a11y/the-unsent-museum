<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A quiet blue museum of unsent letters under a night sky">
<defs>
<linearGradient id="night" x2=".92" y2=".9"><stop stop-color="#061020"/><stop offset=".46" stop-color="#10283f"/><stop offset="1" stop-color="#183b53"/></linearGradient>
<radialGradient id="upper" cx=".76" cy=".17" r=".64"><stop stop-color="#426782" stop-opacity=".64"/><stop offset=".42" stop-color="#244b68" stop-opacity=".25"/><stop offset="1" stop-color="#031021" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop stop-color="#fff5c9"/><stop offset=".23" stop-color="#f3cc79" stop-opacity=".95"/><stop offset=".60" stop-color="#c98f3f" stop-opacity=".19"/><stop offset="1" stop-color="#dba35e" stop-opacity="0"/></radialGradient>
<linearGradient id="stone"><stop stop-color="#2b4b5c"/><stop offset=".3" stop-color="#132d43"/><stop offset=".7" stop-color="#0b2034"/><stop offset="1" stop-color="#273f4a"/></linearGradient>
<linearGradient id="folio" x2=".65" y2=".9"><stop stop-color="#b59668"/><stop offset=".47" stop-color="#e0c99e"/><stop offset="1" stop-color="#775c43"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".27" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer></filter>
<filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="3" seed="22"/><feColorMatrix type="matrix" values=".05 0 0 0 .01 0 .12 0 0 .03 0 0 .19 0 .07 0 0 0 .24 0"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="dots" width="137" height="113" patternUnits="userSpaceOnUse"><circle cx="19" cy="27" r="1.2" fill="#d2d4bf" opacity=".32"/><circle cx="95" cy="78" r=".75" fill="#8baabc" opacity=".37"/><circle cx="127" cy="12" r=".8" fill="#d6be86" opacity=".25"/></pattern>
</defs>
<rect width="1800" height="1000" fill="url(#night)"/><rect width="1800" height="1000" fill="url(#upper)"/><rect width="1800" height="1000" fill="url(#dots)"/>
<rect width="1800" height="1000" filter="url(#wash)" opacity=".7"/>
